const glifo = (g, peso) => ({ size = 16, className = "", style = {} }) => React.createElement("span", {
  className,
  style: { fontSize: (size || 16) * 1.05, lineHeight: 1, fontWeight: peso || 400, display: "inline-block", ...style }
}, g);
const Wallet = glifo("\u{1F4B6}"), MapIcon = glifo("\u{1F5FA}\uFE0F"), Compass = glifo("\u{1F9ED}"), ShoppingBasket = glifo("\u{1F9FA}"), Home = glifo("\u{1F3D6}\uFE0F");
const Users = glifo("\u{1F46F}"), ShieldCheck = glifo("\u{1F6DF}");
const Plus = glifo("+", 700), X = glifo("\u2715"), Check = glifo("\u2713", 700), Loader2 = glifo("\u25CC", 700);
const RefreshCw = glifo("\u21BB"), Download = glifo("\u2193", 700), Upload = glifo("\u2191", 700);
const ChevronDown = glifo("\u2304", 700), ChevronUp = glifo("\u2303", 700);
const ZoomIn = glifo("+", 700), ZoomOut = glifo("\u2212", 700), Maximize = glifo("\u2922");
const API = "https://jsonblob.com/api/jsonBlob";
const CHIAVE_CODICE = "marche2026:codice";
const CHIAVE_CACHE = "marche2026:cache";
let codice = new URLSearchParams(location.hash.replace(/^#/, "")).get("c") || localStorage.getItem(CHIAVE_CODICE) || null;
const archivio = {
  get codice() {
    return codice;
  },
  ricorda(id) {
    codice = id;
    localStorage.setItem(CHIAVE_CODICE, id);
    location.hash = "c=" + id;
  },
  async crea(dati) {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dati) });
    const loc = r.headers.get("Location") || r.headers.get("location");
    if (!loc) throw new Error("codice non leggibile");
    archivio.ricorda(loc.split("/").pop());
    return codice;
  },
  async leggi() {
    if (!codice) return localStorage.getItem(CHIAVE_CACHE);
    const r = await fetch(`${API}/${codice}`, { cache: "no-store" });
    if (!r.ok) throw new Error("lettura fallita");
    const testo = JSON.stringify(await r.json());
    localStorage.setItem(CHIAVE_CACHE, testo);
    return testo;
  },
  async scrivi(testo) {
    localStorage.setItem(CHIAVE_CACHE, testo);
    if (!codice) return;
    const r = await fetch(`${API}/${codice}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: testo });
    if (!r.ok) throw new Error("scrittura fallita");
  }
};
